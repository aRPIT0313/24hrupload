name: Daily 8 Shorts

permissions:
  contents: write

on:
  schedule:
    # 4:00 PM IST = 10:30 AM UTC
    - cron: '30 10 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-shorts
  cancel-in-progress: false

jobs:
  generate-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      SHORT_STYLE: Documentary
      SHORT_VOICE: Kore
      PYTHONUNBUFFERED: '1'

    steps:

      - name: Checkout current project + shared history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run daily 8-Short batch
        env:
          GITHUB_ACTIONS: 'true'
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python auto_batch.py